; ============================================================
; Meshtastic Joystick Navigation — Heltec V3 & V4
; PlatformIO configuration
; ============================================================
; Firmware base: Meshtastic v2.7.x (ESP32-S3 + SX1262)
; Joystick: 5-way navigation (UP / DOWN / LEFT / RIGHT / CENTER)
; ============================================================

[platformio]
default_envs = heltec_v3_joystick

; -------------------------------------------------------
; Shared settings for both boards
; -------------------------------------------------------
[env_base]
platform          = espressif32 @ ^6.9.0
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600

; Core Meshtastic + peripheral libraries
lib_deps =
    meshtastic/Meshtastic-device @ ^2.7.0
    heltec-dev/Heltec ESP32 Dev-Boards @ ^2.0.2
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    lewisxhe/XPowersLib @ ^0.2.3

build_flags =
    -DMESHTASTIC_EXCLUDE_WIFI=0
    -DMESHTASTIC_EXCLUDE_BLUETOOTH=0
    -DUSE_SX1262
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -mfix-esp32-psram-cache-issue

; -------------------------------------------------------
; Heltec WiFi LoRa 32 V3 + Joystick
; -------------------------------------------------------
[env:heltec_v3_joystick]
extends           = env_base
board             = heltec_wifi_lora_32_V3
build_flags =
    ${env_base.build_flags}
    -DHELTEC_V3
    -DJOYSTICK_PIN_UP=1
    -DJOYSTICK_PIN_DOWN=2
    -DJOYSTICK_PIN_LEFT=4
    -DJOYSTICK_PIN_RIGHT=5
    -DJOYSTICK_PIN_CENTER=6
    -DJOYSTICK_DEBOUNCE_MS=50
    -DJOYSTICK_LONG_PRESS_MS=800
    -DBOARD_VARIANT_PATH=\"src/variants/heltec_v3_joystick/variant.h\"

extra_scripts      = pre:scripts/pre_build.py

; -------------------------------------------------------
; Heltec WiFi LoRa 32 V4 + Joystick
; -------------------------------------------------------
[env:heltec_v4_joystick]
extends           = env_base
board             = heltec_wifi_lora_32_V3   ; V4 shares the same PlatformIO board ID
                                              ; with V3; differentiated via build flags

build_flags =
    ${env_base.build_flags}
    -DHELTEC_V4
    -DJOYSTICK_PIN_UP=1
    -DJOYSTICK_PIN_DOWN=2
    -DJOYSTICK_PIN_LEFT=4
    -DJOYSTICK_PIN_RIGHT=5
    -DJOYSTICK_PIN_CENTER=6
    -DJOYSTICK_DEBOUNCE_MS=50
    -DJOYSTICK_LONG_PRESS_MS=800
    -DBOARD_VARIANT_PATH=\"src/variants/heltec_v4_joystick/variant.h\"

extra_scripts      = pre:scripts/pre_build.py
